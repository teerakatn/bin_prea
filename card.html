    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e3f2fd; /* สีพื้นหลังฟ้าอ่อน */
            padding: 20px;
        }

        /* หัวใจลอยพื้นหลัง */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float-up 6s ease-in infinite;
            opacity: 0.6;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ซองจดหมาย */
        .envelope-container {
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease;
        }

        .envelope {
            position: relative;
            width: 500px;
            max-width: 95vw;
        }

        /* ตัวซองด้านล่าง */
        .envelope-back {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 150px;
            background: linear-gradient(180deg, #81d4fa 0%, #4fc3f7 100%);
            border-radius: 0 0 20px 20px;
            z-index: -1;
        }


        /* กระดาษจดหมาย */
        .letter {
            background: linear-gradient(180deg, #ffffff 0%, #e3f2fd 100%);
            border-radius: 15px;
            padding: 30px;
            padding-top: 80px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 3px solid #81d4fa;
        }

        /* รูปโพลารอยด์มุมซ้ายบน */
        .polaroid {
            position: absolute;
            top: -30px;
            left: -20px;
            background: white;
            padding: 8px;
            padding-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: rotate(-12deg);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .polaroid:hover {
            transform: rotate(-5deg) scale(1.05);
        }

        .polaroid img {
            width: 120px;
            height: auto;
            max-height: 160px;
            object-fit: contain;
            display: block;
        }

        /* QR Code */
        .qr-code {
            text-align: center;
            margin-top: 20px;
        }

        .qr-code img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border: 3px solid #81d4fa;
            border-radius: 10px;
            padding: 5px;
            background: white;
        }

        /* หัวข้อ */
        .title {
            text-align: center;
            color: #1976d2;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* เนื้อหาจดหมาย */
        .content {
            text-align: center;
            color: #555;
            font-size: 1rem;
            line-height: 1.8;
        }

        .content p {
            margin-bottom: 15px;
        }

        .signature {
            text-align: center;
            margin-top: 20px;
            color: #1976d2;
            font-weight: bold;
        }

        /* หมีน่ารัก */
        .bears {
            position: absolute;
            bottom: -60px;
            right: -20px;
            z-index: 5;
        }

        .bears img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            animation: bounce 2s infinite 0.3s;
        }

        .bear-left {
            animation: bounce 2s infinite;
        }

        .bear-right {
            animation: bounce 2s infinite 0.3s;
        }

        /* Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti Styles */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .confetti {
            position: absolute;
            top: -20px;
            width: 12px;
            height: 12px;
            animation: confetti-fall linear forwards;
        }

        .confetti.circle {
            border-radius: 50%;
        }

        .confetti.square {
            border-radius: 2px;
        }

        .confetti.triangle {
            width: 0;
            height: 0;
            background: transparent !important;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid #ff6b6b;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        /* Image Slider */
        .image-slider {
            position: relative;
            width: 100%;
            max-width: 280px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(25, 118, 210, 0.3);
            border: 3px solid #81d4fa;
            background: white;
        }

        .slider-container {
            display: flex;
            flex-direction: row;
            transition: transform 0.8s ease-in-out;
            align-items: center;
        }

        .slider-image {
            min-width: 100%;
            width: 100%;
            height: auto;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .slider-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #90caf9;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider-dot.active {
            background: #1976d2;
            transform: scale(1.2);
        }

        /* Music Button */
        #musicBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #81d4fa 0%, #4fc3f7 100%);
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(25, 118, 210, 0.4);
            z-index: 1001;
            transition: all 0.3s ease;
            animation: pulse-music 2s infinite;
        }

        #musicBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.5);
        }

        @keyframes pulse-music {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Responsive */

            .envelope {
                width: 100%;

                height: auto;

            }
        }

    <script>
        // สร้าง Confetti
        function createConfetti() {
            const confettiContainer = document.getElementById('confetti');
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43'];
            const shapes = ['circle', 'square', 'triangle'];
            
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti ' + shapes[Math.floor(Math.random() * shapes.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confettiContainer.appendChild(confetti);
            }
        }

        // เริ่ม confetti เมื่อโหลดหน้า
        window.onload = function() {
            createConfetti();
            createFloatingHearts();
            
            // เล่นเพลงอัตโนมัติ
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicBtn');
            music.play().then(() => {
                btn.textContent = '🔊';
            }).catch(e => {
                console.log('Autoplay blocked, waiting for user interaction');
            });
        };

        // สร้างหัวใจลอย
        function createFloatingHearts() {
            const container = document.getElementById('hearts-bg');
            const hearts = ['💙', '🩵', '⭐', '✨', '💙'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(heart);
            }
        }

        // Image Slider Auto-scroll with Loop
        function initSlider() {
            const container = document.getElementById('sliderContainer');
            const dotsContainer = document.getElementById('sliderDots');
            const images = container.querySelectorAll('.slider-image');
            const totalImages = images.length;
            let currentIndex = 0;
            let autoScrollTimer = null;

            // สร้าง dots
            for (let i = 0; i < totalImages; i++) {
                const dot = document.createElement('div');
                dot.className = 'slider-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            }

            const dots = dotsContainer.querySelectorAll('.slider-dot');

            function updateDots() {
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentIndex);
                });
            }

            function goToSlide(index) {
                currentIndex = index;
                container.style.transform = `translateX(-${currentIndex * 100}%)`;
                updateDots();
            }

            function nextSlide() {
                if (currentIndex >= totalImages - 1) {
                    // ถึงรูปสุดท้ายแล้ว: หยุดเลื่อนอัตโนมัติ (ไม่วนลูป)
                    if (autoScrollTimer) {
                        clearInterval(autoScrollTimer);
                        autoScrollTimer = null;
                    }
                    return;
                }

                currentIndex++;
                goToSlide(currentIndex);
            }

            // เลื่อนอัตโนมัติทุก 3 วินาที
            autoScrollTimer = setInterval(nextSlide, 3000);
        }

        // เรียกใช้ slider
        window.addEventListener('load', initSlider);

        // เพลงพื้นหลัง - เล่นอัตโนมัติเมื่อคลิกหน้าเว็บ
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicBtn');
        let musicStarted = false;

        // ตรวจจับเมื่อเพลงจบ - redirect ไปหน้า surprise
        music.addEventListener('ended', function() {
            // เพลงจบแล้ว redirect ไปหน้า surprise
            window.location.href = 'surprise.html';
        });

        // พยายามเล่นอัตโนมัติเมื่อคลิกที่หน้าเว็บ
        document.addEventListener('click', function startMusic() {
            if (!musicStarted) {
                music.play().then(() => {
                    btn.textContent = '🔊';
                    musicStarted = true;
                }).catch(e => console.log('Autoplay blocked'));
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.textContent = '🔊';
            } else {
                music.pause();
                btn.textContent = '🎵';
            }
        }
    </script>

</body>
</html>
